name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Tesseract is not installed here on purpose: the tests must not need it.
      - name: Test
        run: python -m pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t renombrador-pdf .
      - name: Smoke test
        run: |
          docker run -d --name renombrador -p 127.0.0.1:8765:8000 renombrador-pdf
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health > health.json && break
            sleep 1
          done
          cat health.json
          python3 - <<'PY'
          import json
          health = json.load(open("health.json"))
          assert health["app_id"] == "renombrador-pdf", health
          assert health["tesseract_ready"] and "spa" in health["available_languages"], health
          PY
          # The server must not run as root.
          test "$(docker exec renombrador awk '/^Uid:/ {print $2}' /proc/1/status)" = "10001"

  ui-lint:
    name: Lint the browser UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
